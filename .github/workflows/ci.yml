name: ci

# The checks themselves live in excelano/.github, so every Rust repo in the
# fleet runs the same ones and a correction reaches all of them at once. What
# stays here is when to run: that is this repo's business, the policy is the
# fleet's.
#
# The second job is this repository's own. docling.rs releases several times a
# week and has changed the document model inside a minor release; every match
# on `Node` here is exhaustive so such a release fails the build rather than
# dropping a node silently. This job builds against the newest docling-core
# the pin admits, on every push and once a week regardless, so the failure is
# seen the day the release lands rather than the day a downstream bumps its
# pin. DESIGN.md §3.
#
# The third installs LibreOffice and runs the round-trip tests, which open
# every package they write in headless Writer when `soffice` is on the path
# and skip that check when it is not. DESIGN.md §6.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  ci:
    uses: excelano/.github/.github/workflows/rust-ci.yml@main

  docling-latest:
    name: Newest docling-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Move docling-core to its newest release
        run: cargo update -p docling-core && grep -A1 'name = "docling-core"' Cargo.lock

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  writer:
    name: Opens in Writer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install LibreOffice Writer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Round trip, opened in Writer
        run: cargo test -p waddle-core --test roundtrip -- --nocapture 2>&1 | tee writer.log && ! grep -q "soffice not installed" writer.log
