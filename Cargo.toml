[workspace]
resolver = "2"
members = ["crates/waddle-core", "crates/waddle"]

[workspace.package]
version = "0.1.1"
edition = "2024"
authors = ["David M. Anderson"]
license = "MIT"
repository = "https://github.com/excelano/waddle"
# docling's own floor; docling-core's is lower. Rises when theirs does.
rust-version = "1.88"

[workspace.dependencies]
waddle-core = { path = "crates/waddle-core", version = "0.1.1" }
# The DoclingDocument model and nothing else of docling's. The pin is the
# newest release at the time of writing and only moves forward; DESIGN.md §3
# says how a new release is noticed and why every match on `Node` is
# exhaustive.
docling-core = "1.49"
clap = { version = "4.6", features = ["derive"] }
# Package assembly. Defaults pull zstd, xz and bzip2; an office package only
# ever stores or deflates, and the zlib-rs backend is pure Rust.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# docling.rs's readers, for the binary's input and for the library's
# round-trip tests. Without default features it is the pure-Rust declarative
# converters and nothing that compiles C.
docling = { version = "1.49", default-features = false }
# The binary's asset resolver: the picture sources docling's readers leave
# behind. roxmltree and serde_json read them out of the input; image names
# the format and size of the bytes found; every decoder here is pure Rust.
roxmltree = "0.20"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
